<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Habitica NoBailey</title>
    <link rel="stylesheet" href="popup.css"/>
</head>
<body>
    <h3>Habitica NoBailey</h3>
    <div class="cardWrapper">
        <div class="card">
            <div class="switchWrapper">
                <label class="switch">
                    <input type="checkbox" id="toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="status" id="status"></div>
        </div>
    </div>
    <div class="cardWrapper">
        <div class="card">
            <div class="status" id="counterValue"></div>
            <div class="status" id="popupsBlockedText"></div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
